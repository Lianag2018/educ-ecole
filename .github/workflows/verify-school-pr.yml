name: Vérifier Éduc École — deux profils
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Tablet reading surface
        run: node ops/tests/reader-browser.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
