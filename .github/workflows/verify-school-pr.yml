name: Vérifier le cahier de Mely-Ann
on:
  pull_request:
    paths:
      - 'src/**'
      - 'ops/**'
      - '.github/workflows/verify-school-pr.yml'
  push:
    branches:
      - 'fix/mely-grade1-audio'
permissions:
  contents: read
concurrency:
  group: school-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
