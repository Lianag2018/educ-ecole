<!doctype html>
<html lang="fr-CA"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Mot de passe oublié · Éduc École</title><link rel="stylesheet" href="/src/style.css"></head>
<body><main id="main"><section class="panel"><h1>Retrouver mon accès parent</h1><form id="request-recovery"><p>Entre le courriel de ton compte parent. Tu recevras un lien pour choisir un nouveau mot de passe.</p><label>Courriel<input type="email" name="email" autocomplete="username" maxlength="254" required></label><button>Recevoir le lien par courriel</button></form><form id="reset-password" hidden><p>Choisis ton nouveau mot de passe. Tes profils et tes progrès sont conservés.</p><label>Nouveau mot de passe (12 caractères minimum)<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label>Confirme ton nouveau mot de passe<input name="confirmation" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button>Enregistrer mon nouveau mot de passe</button></form><p id="recovery-status" role="status" aria-live="polite" tabindex="-1"></p><p><a href="/">Retour à mon atelier</a></p></section></main><script type="module" src="/src/parent-recovery.js"></script></body></html>
